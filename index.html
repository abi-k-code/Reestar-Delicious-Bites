<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reestar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>Reestar</h1>
    <p>Home | Recipe | Contact</p>
  </div>

  <!-- Menu Section -->
  <div class="menu">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" alt="Food">
      <h3>Grilled Chicken Salad Bowl</h3>
      <p>Fresh, healthy and delicious</p>
      <button>Order Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1525755662778-989d0524087e" alt="Food">
      <h3>Honey Garlic Prawns</h3>
      <p>Sweet, spicy and flavorful</p>
      <button>Order Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd" alt="Food">
      <h3>Fresh Avocado Veggie Salad</h3>
      <p>A perfect healthy delight</p>
      <button>Order Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1495214783159-3503fd1b572d" alt="Food">
      <h3>Gourmet Seafood Toast</h3>
      <p>Crispy, creamy and tasty</p>
      <button>Order Now</button>
    </div>
  </div>

  <!-- Contact Section -->
  <div class="contact">
    <h2>Contact Us</h2>
    <input type="text" placeholder="Name"><br>
    <input type="number" placeholder="Age"><br>
    <input type="email" placeholder="Email"><br>
    <button>Send</button>
  </div>

</body>
</html>
